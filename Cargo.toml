[package]
name = "speedier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Speedier is a native macOS calculator built with Rust and GPUI."

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component-assets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
core-text = "=21.0.0"

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }

[package.metadata.bundle]
name = "Speedier"
identifier = "com.speedier.app"
icon = ["assets/icon.png"]
resources = ["assets"]
category = "public.app-category.productivity"
short_description = "A keyboard-first macOS calculator"
